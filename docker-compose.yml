services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: simmery
      POSTGRES_PASSWORD: simmery
      POSTGRES_DB: simmery
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U simmery -d simmery']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
